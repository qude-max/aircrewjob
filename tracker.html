<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) + Consent Mode v2 -->

    try{if(localStorage.getItem('acj_consent')==='granted')gtag('consent','update',{ad_storage:'granted',ad_user_data:'granted',ad_personalization:'granted',analytics_storage:'granted'});}catch(e){}

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Applications — AirCrew Jobs</title>
  <meta name="description" content="Track every airline you've applied to in one place — status, dates and notes. Never lose track of your aviation job hunt.">
  <link rel="canonical" href="https://www.aircrewjob.com/tracker.html">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#05080f">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .trk-wrap { max-width: 820px; margin: 0 auto; }
    .trk-banner { border: 1px solid var(--border-bright); background: rgba(56,224,255,0.06); border-radius: var(--radius); padding: 14px 18px; margin-bottom: 22px; font-size: 0.9rem; color: var(--text-dim); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
    .trk-card { border: 1px solid var(--border); background: var(--surface); border-radius: 14px; padding: 16px 18px; margin-bottom: 14px; }
    .trk-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .trk-role { font-family: var(--font-display); font-weight: 600; font-size: 1.02rem; }
    .trk-air { color: var(--text-faint); font-size: 0.88rem; margin-top: 2px; }
    .trk-meta { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
    .trk-status { font-family: var(--font-body); font-size: 0.86rem; padding: 7px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-2); color: var(--text); }
    .trk-date { font-size: 0.8rem; color: var(--text-faint); }
    .trk-notes { width: 100%; margin-top: 10px; min-height: 44px; resize: vertical; background: var(--bg-2); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; color: var(--text-dim); font-family: var(--font-body); font-size: 0.86rem; }
    .trk-rm { background: none; border: none; color: var(--text-faint); cursor: pointer; font-size: 0.82rem; }
    .trk-rm:hover { color: var(--red); }
    .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    .empty { text-align: center; color: var(--text-faint); padding: 50px 20px; }
    .trk-addrow { margin-bottom: 16px; }
    .trk-add-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 560px) { .trk-add-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <header class="page-hero">
    <div class="container trk-wrap">
      <span class="eyebrow">Your job hunt</span>
      <h1 style="margin-top:20px">My <span class="gradient-text">Applications</span></h1>
      <p>Every airline you've applied to, in one place — status, dates and notes. Applied to 20 airlines? Never lose track again.</p>
    </div>
  </header>

  <section style="padding-top:10px">
    <div class="container trk-wrap">
      <div id="trkBanner" class="trk-banner" style="display:none"></div>

      <div class="trk-addrow">
        <button class="btn btn-primary btn-sm" id="addToggle">+ Add an application</button>
      </div>
      <form id="addForm" class="trk-card" style="display:none">
        <div class="trk-add-grid">
          <input class="input" id="addAirline" placeholder="Airline / company *" autocomplete="off">
          <input class="input" id="addRole" placeholder="Role — e.g. First Officer" autocomplete="off">
          <select class="trk-status" id="addStatus" style="width:100%"></select>
          <input class="input" id="addDate" type="date">
        </div>
        <textarea class="trk-notes" id="addNotes" placeholder="Notes (optional) — applied via airline site, recruiter, walk-in…"></textarea>
        <div style="display:flex; gap:8px; margin-top:10px">
          <button class="btn btn-primary btn-sm" type="submit">Add to my list</button>
          <button class="btn btn-ghost btn-sm" type="button" id="addCancel">Cancel</button>
        </div>
      </form>

      <div id="trkList"></div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/config.js"></script>
  <script src="assets/data.js"></script>
  <script src="assets/backend.js"></script>
  <script src="assets/app.js"></script>
  <script>
    const STATUSES = [
      ["applied", "Applied", "#38e0ff"],
      ["interviewing", "Interviewing", "#ffc555"],
      ["offer", "Offer", "#7c8cff"],
      ["hired", "Hired ✓", "#34e8a0"],
      ["not_hired", "Not hired", "#ff6b81"]
    ];
    const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const fmtDate = d => { try { return new Date(d).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }); } catch (e) { return ""; } };

    async function render() {
      await Backend.ready;
      // signed-in users: pull any device-local items into the account once
      if (Backend.tracker.signedIn()) { try { await Backend.tracker.syncLocalUp(); } catch (e) {} }

      const items = await Backend.tracker.list();
      const banner = document.getElementById("trkBanner");
      if (!Backend.tracker.signedIn() && items.length) {
        banner.style.display = "flex";
        banner.innerHTML = "🔒 Saved on this device only. <a href='auth.html' style='color:var(--accent);font-weight:600'>Create a free account</a> to sync across devices &amp; get follow-up reminders.";
      } else { banner.style.display = "none"; }

      const list = document.getElementById("trkList");
      if (!items.length) {
        list.innerHTML = "<div class='empty'><div style='font-size:2rem'>🛫</div><p style='margin-top:10px'>No applications tracked yet.<br>When you apply to a job, hit <b>\"Yes — track it\"</b> and it'll appear here.</p><p style='margin-top:18px'><a class='btn btn-primary btn-sm' href='jobs.html'>Browse jobs →</a></p></div>";
        return;
      }
      list.innerHTML = items.map(it => {
        const opts = STATUSES.map(([v, label]) => `<option value="${v}" ${it.status === v ? "selected" : ""}>${label}</option>`).join("");
        const col = (STATUSES.find(s => s[0] === it.status) || STATUSES[0])[2];
        return `<div class="trk-card" data-id="${esc(it.id)}">
          <div class="trk-top">
            <div>
              <div class="trk-role"><span class="dot" style="background:${col}"></span>${esc(it.role || "Application")}</div>
              <div class="trk-air">${esc(it.airline || "")}</div>
            </div>
            <button class="trk-rm" data-rm="${esc(it.id)}">✕ remove</button>
          </div>
          <div class="trk-meta">
            <select class="trk-status" data-st="${esc(it.id)}">${opts}</select>
            <span class="trk-date">Applied ${fmtDate(it.appliedAt)}</span>
          </div>
          <textarea class="trk-notes" data-note="${esc(it.id)}" placeholder="Notes — interview date, who you spoke to, follow-up…">${esc(it.notes)}</textarea>
        </div>`;
      }).join("");

      list.querySelectorAll("[data-st]").forEach(sel => sel.addEventListener("change", async () => {
        await Backend.tracker.update(sel.dataset.st, { status: sel.value });
        const col = (STATUSES.find(s => s[0] === sel.value) || STATUSES[0])[2];
        sel.closest(".trk-card").querySelector(".dot").style.background = col;
      }));
      list.querySelectorAll("[data-note]").forEach(t => t.addEventListener("blur", async () => {
        await Backend.tracker.update(t.dataset.note, { notes: t.value });
      }));
      list.querySelectorAll("[data-rm]").forEach(b => b.addEventListener("click", async () => {
        await Backend.tracker.remove(b.dataset.rm);
        render();
      }));
    }
    // Manual add — also lets people log applications made off-platform (a magnet for external users)
    (function () {
      const sel = document.getElementById("addStatus");
      sel.innerHTML = STATUSES.map(([v, label]) => `<option value="${v}">${label}</option>`).join("");
      document.getElementById("addDate").value = new Date().toISOString().slice(0, 10);
      const form = document.getElementById("addForm"), toggle = document.getElementById("addToggle");
      toggle.addEventListener("click", () => { form.style.display = "block"; toggle.style.display = "none"; document.getElementById("addAirline").focus(); });
      document.getElementById("addCancel").addEventListener("click", () => { form.style.display = "none"; toggle.style.display = "inline-flex"; });
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const airline = document.getElementById("addAirline").value.trim();
        if (!airline) { document.getElementById("addAirline").focus(); return; }
        await Backend.ready;
        const dv = document.getElementById("addDate").value;
        await Backend.tracker.add({
          jobId: null, airline,
          role: document.getElementById("addRole").value.trim() || "Application",
          status: document.getElementById("addStatus").value,
          appliedAt: dv ? new Date(dv).toISOString() : new Date().toISOString(),
          notes: document.getElementById("addNotes").value.trim()
        });
        form.reset();
        document.getElementById("addDate").value = new Date().toISOString().slice(0, 10);
        form.style.display = "none"; toggle.style.display = "inline-flex";
        render();
      });
    })();

    render();
  </script>
</body>
</html>
