<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — AirCrew Jobs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .auth-wrap { min-height: 100vh; display: grid; place-items: center; padding: 110px 0 60px; }
    .auth-card { width: min(440px, 92vw); padding: 40px; }
    .auth-tabs { display: flex; gap: 8px; margin-bottom: 28px; }
    .auth-tab {
      flex: 1; text-align: center; padding: 11px; cursor: pointer; border-radius: 10px;
      font-family: var(--font-display); font-weight: 600; font-size: 0.92rem;
      color: var(--text-dim); border: 1px solid var(--border); background: var(--surface); transition: all 0.2s;
    }
    .auth-tab.active { color: var(--accent); background: rgba(56,224,255,0.1); border-color: var(--border-bright); }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 0.8rem; color: var(--text-faint); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.08em; }
    .auth-msg { margin-top: 16px; font-size: 0.9rem; min-height: 1.4em; }
    .auth-msg.err { color: var(--red); }
    .auth-msg.ok { color: var(--green); }
    .mode-pill { text-align: center; margin-top: 22px; font-size: 0.78rem; color: var(--text-faint); }
  </style>
</head>
<body>

  <div class="auth-wrap">
    <div class="card auth-card">
      <h2 style="margin-bottom:6px">Welcome aboard</h2>
      <p style="font-size:0.95rem; margin-bottom:26px">Save jobs, track applications and set hiring alerts.</p>

      <div class="auth-tabs">
        <div class="auth-tab active" data-mode="signin">Sign in</div>
        <div class="auth-tab" data-mode="signup">Create account</div>
      </div>

      <form id="authForm">
        <div class="field" id="roleField" style="display:none">
          <label>I am a…</label>
          <div style="display:flex; gap:8px">
            <div class="auth-tab role-tab active" data-role="pilot">🧑‍✈️ Pilot</div>
            <div class="auth-tab role-tab" data-role="crew">🛎️ Cabin Crew</div>
            <div class="auth-tab role-tab" data-role="recruiter">🏢 Recruiter</div>
          </div>
          <div id="roleHint" style="font-size:0.78rem; color:var(--text-faint); margin-top:8px"></div>
        </div>
        <div class="field" id="companyField" style="display:none">
          <label>Company / operator</label>
          <input class="input" id="fCompany" type="text" placeholder="e.g. Skyline Aviation Ltd">
        </div>
        <div class="field" id="nameField" style="display:none">
          <label>Full name</label>
          <input class="input" id="fName" type="text" placeholder="Amelia Earhart" autocomplete="name">
        </div>
        <div class="field">
          <label>Email</label>
          <input class="input" id="fEmail" type="email" placeholder="you@airline.com" required autocomplete="email">
        </div>
        <div class="field">
          <label>Password</label>
          <input class="input" id="fPassword" type="password" placeholder="••••••••" required minlength="6" autocomplete="current-password">
        </div>
        <button class="btn btn-primary" type="submit" id="submitBtn" style="width:100%; justify-content:center">Sign in →</button>
        <div class="auth-msg" id="authMsg"></div>
        <p style="text-align:center; margin-top:14px">
          <a href="#" id="forgotLink" style="color:var(--text-faint); font-size:0.84rem; text-decoration:none">Forgot your password?</a>
        </p>
      </form>

      <!-- Reset request -->
      <form id="resetForm" style="display:none">
        <p style="font-size:0.92rem; margin-bottom:18px">Enter your account email and we'll send you a reset link.</p>
        <div class="field">
          <label>Email</label>
          <input class="input" id="rEmail" type="email" placeholder="you@airline.com" required autocomplete="email">
        </div>
        <button class="btn btn-primary" type="submit" style="width:100%; justify-content:center">Send reset link →</button>
        <div class="auth-msg" id="resetMsg"></div>
        <p style="text-align:center; margin-top:14px">
          <a href="#" id="backToSignin" style="color:var(--text-faint); font-size:0.84rem; text-decoration:none">← Back to sign in</a>
        </p>
      </form>

      <!-- New password (after clicking the email link) -->
      <form id="recoveryForm" style="display:none">
        <p style="font-size:0.92rem; margin-bottom:18px">Choose a new password for your account.</p>
        <div class="field">
          <label>New password</label>
          <input class="input" id="newPw" type="password" placeholder="••••••••" required minlength="6" autocomplete="new-password">
        </div>
        <button class="btn btn-primary" type="submit" style="width:100%; justify-content:center">Set new password →</button>
        <div class="auth-msg" id="recoveryMsg"></div>
      </form>

      <div class="mode-pill" id="modePill"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/config.js"></script>
  <script src="assets/data.js"></script>
  <script src="assets/backend.js"></script>
  <script src="assets/app.js"></script>
  <script>
    let authMode = "signin", signupRole = "pilot";
    const msg = document.getElementById("authMsg");
    const ROLE_HINTS = {
      pilot: "Save jobs, track applications, set hiring alerts.",
      crew: "Cabin crew vacancies are coming soon — create your account now and you'll be first to know.",
      recruiter: "Post vacancies and review applicants. New recruiter accounts are reviewed by our team before posting is enabled."
    };
    const homeFor = p => (p?.role === "recruiter" ? "recruiter.html" : "account.html");

    document.querySelectorAll(".auth-tab:not(.role-tab)").forEach(t => t.addEventListener("click", () => {
      document.querySelectorAll(".auth-tab:not(.role-tab)").forEach(x => x.classList.remove("active"));
      t.classList.add("active");
      authMode = t.dataset.mode;
      const signup = authMode === "signup";
      document.getElementById("nameField").style.display = signup ? "block" : "none";
      document.getElementById("roleField").style.display = signup ? "block" : "none";
      document.getElementById("companyField").style.display = signup && signupRole === "recruiter" ? "block" : "none";
      document.getElementById("roleHint").textContent = signup ? ROLE_HINTS[signupRole] : "";
      document.getElementById("submitBtn").textContent = signup ? "Create account →" : "Sign in →";
      msg.textContent = "";
    }));

    document.querySelectorAll(".role-tab").forEach(t => t.addEventListener("click", () => {
      document.querySelectorAll(".role-tab").forEach(x => x.classList.remove("active"));
      t.classList.add("active");
      signupRole = t.dataset.role;
      document.getElementById("companyField").style.display = signupRole === "recruiter" ? "block" : "none";
      document.getElementById("roleHint").textContent = ROLE_HINTS[signupRole];
    }));

    document.getElementById("authForm").addEventListener("submit", async e => {
      e.preventDefault();
      msg.className = "auth-msg";
      msg.textContent = "…";
      const email = document.getElementById("fEmail").value.trim();
      const pw = document.getElementById("fPassword").value;
      const name = document.getElementById("fName").value.trim();
      const company = document.getElementById("fCompany").value.trim();

      if (authMode === "signup" && signupRole === "recruiter" && !company) {
        msg.className = "auth-msg err"; msg.textContent = "Please enter your company name."; return;
      }

      const res = authMode === "signup"
        ? await Backend.auth.signUp(email, pw, name, signupRole, company)
        : await Backend.auth.signIn(email, pw);

      if (res.error) { msg.className = "auth-msg err"; msg.textContent = res.error; return; }
      if (res.confirmEmail) {
        msg.className = "auth-msg ok";
        msg.textContent = "✓ Check your inbox to confirm your email, then sign in.";
        return;
      }
      msg.className = "auth-msg ok";
      msg.textContent = authMode === "signup" && signupRole === "recruiter"
        ? "✓ Account created — pending admin approval. Redirecting…"
        : "✓ Welcome! Redirecting…";
      setTimeout(() => location.href = homeFor(Backend.auth.profile()), 700);
    });

    /* ---- Password reset ---- */
    const showForm = which => {
      document.getElementById("authForm").style.display = which === "auth" ? "block" : "none";
      document.querySelector(".auth-tabs").style.display = which === "auth" ? "flex" : "none";
      document.getElementById("resetForm").style.display = which === "reset" ? "block" : "none";
      document.getElementById("recoveryForm").style.display = which === "recovery" ? "block" : "none";
    };
    document.getElementById("forgotLink").addEventListener("click", e => { e.preventDefault(); showForm("reset"); });
    document.getElementById("backToSignin").addEventListener("click", e => { e.preventDefault(); showForm("auth"); });

    document.getElementById("resetForm").addEventListener("submit", async e => {
      e.preventDefault();
      const m = document.getElementById("resetMsg");
      m.className = "auth-msg"; m.textContent = "…";
      const res = await Backend.auth.resetRequest(document.getElementById("rEmail").value.trim());
      m.className = "auth-msg " + (res.error ? "err" : "ok");
      m.textContent = res.error ? res.error : "✓ If that email has an account, a reset link is on its way. Check your inbox.";
    });

    document.getElementById("recoveryForm").addEventListener("submit", async e => {
      e.preventDefault();
      const m = document.getElementById("recoveryMsg");
      m.className = "auth-msg"; m.textContent = "…";
      const res = await Backend.auth.updatePassword(document.getElementById("newPw").value);
      m.className = "auth-msg " + (res.error ? "err" : "ok");
      m.textContent = res.error ? res.error : "✓ Password updated — taking you to your account…";
      if (!res.error) setTimeout(() => location.href = homeFor(Backend.auth.profile()), 900);
    });

    Backend.ready.then(mode => {
      document.getElementById("modePill").textContent = mode === "demo"
        ? "Running in demo mode — accounts are stored in this browser only."
        : "Connected to live backend.";
      // arriving from a reset-link email?
      if (Backend.auth.isRecovery && Backend.auth.isRecovery()) { showForm("recovery"); return; }
      // small delay: the recovery event can land just after ready resolves
      setTimeout(() => {
        if (Backend.auth.isRecovery && Backend.auth.isRecovery()) { showForm("recovery"); return; }
        if (Backend.auth.user()) location.href = homeFor(Backend.auth.profile());
      }, 600);
    });
  </script>
</body>
</html>
